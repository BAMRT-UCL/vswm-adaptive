<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f5f7fa"><title>Spatial Memory</title><link rel="stylesheet" href="style.css?v=0.7"><script src="task.js?v=0.7" defer></script></head>
<body><main>
<section id="setup" class="setup"><h1>Spatial Memory</h1><label for="participantId">Participant code</label><input id="participantId" autocomplete="off" placeholder="Participant code" maxlength="40"><label for="yearGroup">Year group</label><select id="yearGroup"><option value="">Choose</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option value="adult">Adult</option></select><button id="startBtn" disabled>Start assessment</button></section>
<section id="transition" hidden><h2>Task 2</h2><p>Next, locations will appear one at a time. Remember their order.</p><button id="continueBtn">Start Task 2</button></section>
<section id="assessment" hidden><header class="task-header"><span id="taskTitle">Spatial Memory</span><span id="progress"></span></header><p id="message" aria-live="polite"></p><div id="grid" role="group" aria-label="Memory grid"></div><div class="actions"><button id="beginTrialBtn" hidden>Start trial</button><button id="undoBtn" hidden>Undo</button><button id="submitBtn" hidden>Submit</button></div><p id="feedback" aria-live="polite"></p></section>
<section id="results" hidden><h2>Complete</h2><p id="summary"></p><p id="uploadStatus" role="status"></p><button id="downloadBtn">Download data backup</button><button id="restartBtn">Finish</button></section>
</main></body></html>
