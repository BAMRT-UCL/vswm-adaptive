<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VSWM Adaptive Prototype v0.3</title>
  <link rel="stylesheet" href="style.css">
  <script src="task.js" defer></script>
</head>
<body>
  <main>
    <h1>Spatial Memory Task</h1>
    <section id="setup">
      <label for="participantId">Participant code</label>
      <input id="participantId" autocomplete="off" placeholder="e.g. PILOT001">
      <label for="yearGroup">Year group</label>
      <select id="yearGroup"><option value="">Choose</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select>
      <p>Remember which squares turn blue. After they disappear, select the same squares.</p>
      <button id="startBtn">Start assessment</button>
    </section>
    <section id="assessment" hidden>
      <p id="progress"></p>
      <p id="message" aria-live="polite"></p>
      <div id="grid" role="group" aria-label="Memory grid"></div>
      <div class="actions"><button id="submitBtn" hidden>Submit answer</button><button id="nextBtn" hidden>Next trial</button></div>
      <p id="feedback" aria-live="polite"></p>
    </section>
    <section id="results" hidden>
      <h2>Assessment complete</h2>
      <p id="summary"></p>
      <button id="downloadBtn">Download results (JSON)</button>
      <button id="restartBtn">Start again</button>
    </section>
  </main>
</body>
</html>
